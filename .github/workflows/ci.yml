name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layering:
    # Packages may only depend on lower layers; see Tools/Packaging/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Tools/Packaging/asmdef_graph.py --check

  editmode-tests:
    # Needs a UNITY_LICENSE secret (the contents of a Unity .ulf license) plus UNITY_EMAIL and
    # UNITY_PASSWORD. Without it the job is skipped instead of failing.
    runs-on: ubuntu-latest
    needs: layering
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check for a Unity license
        id: license
        run: echo "present=${{ env.UNITY_LICENSE != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.license.outputs.present == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: steps.license.outputs.present == 'true'
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        if: steps.license.outputs.present == 'true'
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
